name: Deploy

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/notasegura-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/notasegura-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/notasegura-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/notasegura-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host droplet"
            echo "  HostName $DROPLET_HOST"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/deploy_key"
          } > ~/.ssh/config

      - name: Resolve site address
        env:
          SITE_ADDRESS_OVERRIDE: ${{ vars.SITE_ADDRESS }}
        run: echo "SITE_ADDRESS=${SITE_ADDRESS_OVERRIDE:-${DROPLET_HOST//./-}.sslip.io}" >> "$GITHUB_ENV"

      - name: Upload compose files
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GHCR_OWNER: ${{ needs.build.outputs.owner }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          umask 077
          {
            echo "SITE_ADDRESS=$SITE_ADDRESS"
            echo "GHCR_OWNER=$GHCR_OWNER"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "MONGODB_URI=$MONGODB_URI"
          } > .env.deploy
          scp deploy/docker-compose.prod.yml droplet:/opt/notasegura/docker-compose.yml
          scp deploy/Caddyfile droplet:/opt/notasegura/Caddyfile
          scp .env.deploy droplet:/opt/notasegura/.env
          rm .env.deploy

      - name: Start containers
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh droplet "
            set -e
            cd /opt/notasegura
            chmod 600 .env
            docker login ghcr.io -u '$GHCR_USER' --password-stdin
            trap 'docker logout ghcr.io' EXIT
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          "

      - name: Smoke test
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 "https://$SITE_ADDRESS/api/health"; then break; fi
            if [ "$i" = 24 ]; then echo "health check failed"; exit 1; fi
            sleep 5
          done
          curl -fsS --max-time 10 -o /dev/null "https://$SITE_ADDRESS/"
          if curl -s --max-time 5 -o /dev/null "http://$DROPLET_HOST:3000/api/health"; then
            echo "backend port 3000 is reachable from the internet"
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: ssh droplet "cd /opt/notasegura && docker compose ps && docker compose logs --tail 100"
