version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: safenote-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: safenote

  backend:
    build: ./backend
    container_name: safenote-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/safenote
      NOTE_DEFAULT_PASSPHRASE: local-dev-default
      PORT: "3000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-aldocostasantos@gmail.com}
    container_name: safenote-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  mongo_data:
