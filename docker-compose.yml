version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: safenote-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: safenote

  backend:
    build: ./backend
    container_name: safenote-backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/safenote
      PORT: "3000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: safenote-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  mongo_data:
